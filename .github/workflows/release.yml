name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version tags
        run: git fetch --tags --force

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Next version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          chmod +x scripts/semver.sh
          scripts/semver.sh test
          version="$(scripts/semver.sh)"
          build="$(scripts/semver.sh build "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Next version: $version ($build)"

      - name: Skip if this commit is already released
        id: skip
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists; skip publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changelog
        if: steps.skip.outputs.already != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          scripts/semver.sh notes > /tmp/zoomie-notes.md
          scripts/semver.sh changelog "$version" CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md already has ${version}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): v${version} [skip ci]"
            git push
          fi

      - name: Build unsigned app
        if: steps.skip.outputs.already != 'true'
        env:
          ZOOMIE_GOOGLE_CLIENT_SECRET: ${{ secrets.ZOOMIE_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "${ZOOMIE_GOOGLE_CLIENT_SECRET}" ]; then
            echo "Set repo secret ZOOMIE_GOOGLE_CLIENT_SECRET (GCP Desktop client secret)." >&2
            exit 1
          fi
          xcodebuild -scheme Zoomie -project Zoomie.xcodeproj \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            ZOOMIE_GOOGLE_CLIENT_SECRET="${ZOOMIE_GOOGLE_CLIENT_SECRET}" \
            build
          plist="build/DerivedData/Build/Products/Release/Zoomie.app/Contents/Info.plist"
          stamped="$(plutil -extract GoogleClientSecret raw "$plist" 2>/dev/null || true)"
          if [ -z "${stamped}" ]; then
            echo "GoogleClientSecret did not land in Info.plist. Custom INFOPLIST_KEY_ values are ignored." >&2
            exit 1
          fi

      - name: Zip app
        if: steps.skip.outputs.already != 'true'
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release/Zoomie.app \
            Zoomie.zip

      - name: Publish versioned release
        if: steps.skip.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          scripts/semver.sh notes > /tmp/zoomie-notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${version}" Zoomie.zip \
            --title "Zoomie ${version}" \
            --notes-file /tmp/zoomie-notes.md \
            --latest \
            --target "${GITHUB_SHA}"
